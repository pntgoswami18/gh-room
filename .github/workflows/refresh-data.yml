name: refresh-github-data

on:
  schedule:
    - cron: '30 0 * * *' # daily 06:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch GitHub data
        run: node scripts/fetch-github.mjs
        env:
          GH_LOGIN: ${{ github.repository_owner }}
          # GH_PAT (optional): fine-grained PAT, no extra scopes needed. Falls back to the Actions token.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      - name: Commit if changed (push triggers Vercel redeploy)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/github.json
          git diff --cached --quiet || (git commit -m "chore: refresh github data" && git push)
